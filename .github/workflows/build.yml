name: 🧮 Build Geez Calculator APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: com.geez.calculator
  APP_NAME: Geez Calculator
  CI: "true"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🧰 Install Android platform + build tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: 📦 Install Cordova
        run: |
          npm install -g cordova@12
